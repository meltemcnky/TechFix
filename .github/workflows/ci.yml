name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Reject common committed secrets
        shell: bash
        run: |
          if git grep -IqE 'sb_secret_|SUPABASE_(SERVICE_ROLE_KEY|DB_PASSWORD|ACCESS_TOKEN)[[:space:]]*=|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@' -- ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo 'Potential Supabase/database secret detected in a tracked file.'
            exit 1
          fi
